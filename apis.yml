aid: commitchange
name: CommitChange
description: CommitChange is an all-in-one nonprofit fundraising platform providing online
  donation processing, recurring giving, embeddable donation widgets, crowdfunding and
  peer-to-peer fundraising campaigns, professional event pages with ticketing, donor
  management, and a real-time analytics dashboard. Founded in 2012 and acquired by Software
  for Good (Minneapolis, MN) in 2022, the platform charges no monthly fees or long-term
  contracts, taking 5% + $0.30 per transaction with payments processed securely via Stripe.
  CommitChange is built on the open-source Houdini Project (AGPL) and has helped 1,000+
  nonprofits raise $82M+ across 4,700+ campaigns and 2,900+ events.
